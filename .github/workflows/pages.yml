---
name: Publish to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# Allow one deployment at a time, and let an in-progress deployment finish
# rather than cancelling it part way through.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render HTML and PDF
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          # Required for PDF output
          tinytex: true
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The site is the HTML book plus the PDF behind its download button
      # (book.downloads in _quarto.yml). Each single-format render cleans
      # _book/, and --to accepts only one format, so the PDF is rendered
      # first, set aside while the HTML renders, then copied back.
      - name: Render book
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          quarto render --to pdf
          mkdir "${RUNNER_TEMP}/pdf"
          mv _book/*.pdf "${RUNNER_TEMP}/pdf/"
          quarto render --to html
          mv "${RUNNER_TEMP}"/pdf/*.pdf _book/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required to deploy to GitHub Pages
      pages: write
      # Required to verify the deployment originates from this workflow
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
