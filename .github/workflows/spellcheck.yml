---
name: Spellcheck

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  cspell:
    name: Check spelling
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          # npm ci takes a few seconds, and a cache shared between runs could be poisoned
          package-manager-cache: false
      # cspell and its dependencies, at the versions and hashes in package-lock.json.
      # --ignore-scripts, because none of them need an install script to work.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          npm ci --ignore-scripts
      # Checks every file against a British English dictionary, unlike codespell
      # in super-linter, which only knows common misspellings. The language, the
      # files it skips and the words it accepts are in .cspell.json and
      # .cspell-words.txt.
      - name: Check spelling
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          npm run spellcheck
