---
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  # Publishes the site (deploy job) and attaches the book files to the release (release job)
  release:
    types: [published]

permissions: {}

jobs:
  maps:
    name: Generate maps
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.7"
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          python -m pip install --require-hashes -r requirements.txt
      - name: Generate maps
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          python maps/make_maps.py
      - name: Upload maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maps
          path: maps/output/
          if-no-files-found: error

  book:
    name: Render HTML, PDF and e-books
    runs-on: ubuntu-latest
    permissions:
      # Required to read the code
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The full history, for the tags that filters/git-revision.lua prints in the book
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          # Required for PDF output
          tinytex: true
      # Provides ebook-convert, which turns the EPUB into a Kindle file (AZW3)
      - name: Install Calibre
        shell: bash
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends calibre
      # The site is the HTML book plus the PDF, EPUB and AZW3 files behind its
      # download menu (book.sidebar.tools in _quarto.yml). Each single-format
      # render cleans _book/, and --to accepts only one format, so the
      # downloads are rendered first, set aside while the HTML renders, then
      # copied back.
      - name: Render book
        shell: bash
        env:
          # Calibre loads Qt, and the runner has no display
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          downloads="${RUNNER_TEMP}/downloads"
          mkdir "${downloads}"
          quarto render --to pdf
          mv _book/how-far-is-paris.pdf "${downloads}/"
          quarto render --to epub
          mv _book/how-far-is-paris.epub "${downloads}/"
          ebook-convert "${downloads}/how-far-is-paris.epub" "${downloads}/how-far-is-paris.azw3"
          quarto render --to html
          mv "${downloads}"/* _book/
      # The book files on their own, for the release job and so they can be
      # downloaded from any run without unpacking the site.
      - name: Upload book files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: book
          path: |
            _book/how-far-is-paris.pdf
            _book/how-far-is-paris.epub
            _book/how-far-is-paris.azw3
            _book/maps/output/cover.png
          if-no-files-found: error
      # Uploaded on every run so the rendered site can be downloaded from
      # any run, and deployed as-is on releases.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _book/

  deploy:
    name: Deploy to GitHub Pages
    needs: [maps, book]
    # Only releases, so the site always matches the released book. The github-pages environment
    # must allow deployments from release tags (Settings > Environments).
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      # Required to deploy to GitHub Pages
      pages: write
      # Required to verify the deployment originates from this workflow
      id-token: write
    # Allow one deployment at a time, and let an in-progress deployment finish
    # rather than cancelling it part way through. Set on this job only so that
    # CI runs on other branches and pull requests are not queued behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    name: Attach book to release
    needs: [maps, book]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      # Required to upload assets to the release
      contents: write
    steps:
      - name: Download book files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: book
          path: book
      # --clobber replaces the files if the release is published again or the
      # run is re-run
      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          IFS=$'\n\t'
          cp book/maps/output/cover.png how-far-is-paris-cover.png
          gh release upload "${TAG}" \
            book/how-far-is-paris.pdf \
            book/how-far-is-paris.epub \
            book/how-far-is-paris.azw3 \
            how-far-is-paris-cover.png \
            --clobber --repo "${REPO}"
