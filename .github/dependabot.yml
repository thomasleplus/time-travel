---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci(deps)
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"
      osv-scanner:
        patterns:
          - "google/osv-scanner-action*"
      artifacts:
        patterns:
          - "actions/upload-artifact"
          - "actions/download-artifact"
      pages:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build(deps)
