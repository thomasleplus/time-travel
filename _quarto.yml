project:
  type: book
  output-dir: _book

book:
  title: "How Far Is Paris?"
  subtitle: "Two Thousand Years of Travel Time"
  author: "Thomas Leplus"
  date: "2026-09-27"
  isbn: "978-2-493382-01-6"
  cover-image: maps/output/cover.png
  cover-image-alt: >-
    Cover: the same map of western Europe cut into eight strips, one per era from AD 200
    to today, each coloured by travel time from Paris, from weeks in the west to hours in the east.
  site-url: https://thomasleplus.github.io/time-travel/
  repo-url: https://github.com/thomasleplus/time-travel
  # Names the PDF and EPUB files, which the download menu below links to
  output-file: how-far-is-paris
  # Instead of downloads, which cannot list the Kindle file. CI renders the PDF and EPUB
  # and converts the EPUB to AZW3 (.github/workflows/ci.yml).
  sidebar:
    tools:
      - icon: download
        text: Download
        menu:
          - text: Download PDF
            icon: file-pdf
            href: /how-far-is-paris.pdf
          - text: Download EPUB
            icon: journal
            href: /how-far-is-paris.epub
          - text: Download Kindle (AZW3)
            icon: tablet
            href: /how-far-is-paris.azw3
  page-footer:
    left: >-
      © 2026 Thomas Leplus · ISBN 978-2-493382-01-6 ·
      [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) ·
      Code: [github.com/thomasleplus/time-travel](https://github.com/thomasleplus/time-travel)
  chapters:
    - index.qmd
    - chapters/01-roman.qmd
    - chapters/02-medieval.qmd
    - chapters/03-1800.qmd
    - chapters/04-1850.qmd
    - chapters/interlude-news.qmd
    - chapters/05-1914.qmd
    - chapters/06-1950.qmd
    - chapters/07-1975.qmd
    - chapters/08-today.qmd
    - chapters/at-a-glance.qmd
    - chapters/closing.qmd
    - references.qmd

bibliography: references.bib
csl: styles/numeric.csl
link-citations: true

fig-cap-location: bottom
lang: en-GB

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    number-sections: true
    fig-responsive: true
  pdf:
    documentclass: scrbook
    classoption: [oneside]
    papersize: a4
    fontsize: 11pt
    geometry: [margin=2.5cm]
    number-sections: true
    toc: true
    colorlinks: true
    fig-pos: "H"
    include-in-header: styles/cover.tex
    include-before-body: styles/copyright-page.tex
  epub:
    # The ISBN, as a URN: Quarto rejects pandoc's scheme key and pandoc ignores Quarto's schema key
    identifier: "urn:isbn:978-2-493382-01-6"
    # Also shown on the title page, as the e-book's copyright notice
    rights: >-
      © 2026 Thomas Leplus. ISBN 978-2-493382-01-6. This book is licensed under the Creative Commons
      Attribution-NonCommercial-ShareAlike 4.0 International License
      (https://creativecommons.org/licenses/by-nc-sa/4.0/). The code that draws the maps is
      licensed under the Apache License 2.0 and is available at
      https://github.com/thomasleplus/time-travel.
    toc: true
    number-sections: true
    # E-book stores warn about CSS in pandoc's default stylesheet and in the styles Quarto
    # adds to every chapter, so the book has its own stylesheet and a template without them
    css: styles/epub.css
    template: styles/epub.template
    filters:
      - path: filters/epub-div-alt.lua
        at: post-render
  docx:
    reference-doc: styles/reference.docx
    toc: true
    number-sections: true
